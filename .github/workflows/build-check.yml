name: Build check

# Builds the Legacy release APK to confirm the code still compiles.
# It does not sign, release or test anything.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out leveldb + snappy submodules
        run: git submodule update --init --recursive iq80-leveldb/upstream snappy-java/upstream
        
      - name: Check my protected mod lines
        run: |
          fail=0
          check() {
            n=$(grep -cF "$2" "$3" || true)
            if [ "$n" -lt "$4" ]; then echo "MISSING: $1 (found $n, need at least $4)"; fail=1; else echo "OK: $1 ($n)"; fi
          }
          check "Lossless picker UI" "Lossless" app/src/main/java/app/gamenative/ui/component/dialog/GraphicsTab.kt 5
          check "Lossless picker logic" "Lossless" app/src/main/java/app/gamenative/utils/LsfgVkManager.kt 37
          check "Update popup disabled" "if (false &&" app/src/main/java/app/gamenative/ui/PluviaMain.kt 1
          check "Version code line" "APP_VERSION_CODE" app/build.gradle.kts 1
          check "Version name line" "APP_VERSION_NAME" app/build.gradle.kts 1
          n=$(grep "DEFAULT_WINCOMPONENTS =" app/src/main/java/com/winlator/container/Container.java | grep -c "opengl=1" || true)
          if [ "$n" -lt 1 ]; then echo "MISSING: opengl=1 in DEFAULT_WINCOMPONENTS"; fail=1; else echo "OK: opengl=1"; fi
          exit $fail

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create empty local.properties
        run: touch local.properties

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build Legacy release APK
        run: ./gradlew :app:assembleLegacyRelease -x lintVitalLegacyRelease -x lintVitalAnalyzeLegacyRelease
